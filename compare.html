<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Art comparison</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc4e0; font-family: Georgia, serif; }
      canvas { display: block; }
      #bar {
        position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
        padding: 6px; background: rgba(30, 20, 12, 0.82); border: 1px solid #c9a24a; border-radius: 10px;
      }
      #bar a {
        color: #f7e7c2; text-decoration: none; padding: 8px 12px; border-radius: 6px;
        border: 1px solid #a88338; font-size: 14px; background: #4a3220;
      }
      #bar a.on { background: #c9a24a; color: #2b1c11; font-weight: 700; }
      #label {
        position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
        color: #f7e7c2; background: rgba(30, 20, 12, 0.82); padding: 6px 12px; border-radius: 8px; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <div id="label">loading…</div>
    <script type="module" src="/compare/compare.ts"></script>
  </body>
</html>
