<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#8fbcdf" />
    <title>Medieval RTS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 30V12h4v4h4v-4h4v4h4v-4h4v4h4v-4h0v18z' fill='%23596273'/%3E%3Cpath d='M13 30v-7a3 3 0 0 1 6 0v7z' fill='%234a2e18'/%3E%3Cpath d='M16 2v8M16 2l7 3-7 3' stroke='%232f6fd6' stroke-width='2' fill='%232f6fd6'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #8fbcdf; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      body { font-family: system-ui, -apple-system, sans-serif; color: #f0e8d8; -webkit-user-select: none; user-select: none; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }

      #loading {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        font: 700 18px Georgia, serif; color: #2b1c11; letter-spacing: 0.04em; pointer-events: none;
      }

      /* Progress bars over construction sites / training halls (positioned by view.ts). */
      #bars { position: fixed; inset: 0; pointer-events: none; }
      #bars .bar {
        position: absolute; left: -24px; top: -4px; width: 48px; height: 7px;
        background: #1a140c; border: 1px solid #c9a24a; border-radius: 4px; overflow: hidden;
      }
      #bars .bar i { display: block; height: 100%; background: #f2c94c; }
      #bars .bar[data-kind="train"] i { background: #5b8fe6; }
      #bars .bar[data-kind="hp0"] i { background: #4fbf4f; }
      #bars .bar[data-kind="hp1"] i { background: #e04a3a; }
      #bars .bar.small { left: -14px; width: 28px; height: 5px; border-color: rgba(0, 0, 0, 0.6); }

      /* Box-select rectangle (drawn by input.ts). */
      #selbox {
        position: fixed; display: none; pointer-events: none; z-index: 5;
        border: 2px dashed #fff; background: rgba(255, 255, 255, 0.12); border-radius: 3px;
      }

      /* Victory / defeat. */
      #modal {
        position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
        background: rgba(20, 14, 8, 0.55); z-index: 20;
      }
      #modal.show { display: flex; animation: fadein 0.5s ease-out; }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      #modal .card {
        min-width: 240px; padding: 22px 26px; text-align: center; color: #f7e7c2;
        font-family: Georgia, serif; border: 2px solid #c9a24a; border-radius: 14px;
        background: linear-gradient(#4a3320, #2b1c11); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
      #modal h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: 0.08em; text-shadow: 0 2px 0 #000; }
      #modal h1.win { color: #ffd86b; }
      #modal h1.lose { color: #ff8a70; }
      #modal p { margin: 0 0 16px; opacity: 0.85; }
      #modal button {
        min-height: 46px; padding: 0 24px; font: 700 15px Georgia, serif; color: #f7e7c2; cursor: pointer;
        background: linear-gradient(#4f8a3a, #356226); border: 1px solid #a8d890; border-radius: 8px;
      }

      #top {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 8px);
        left: 8px;
        right: 8px;
        display: flex;
        gap: 6px;
        justify-content: center;
        pointer-events: none;
      }
      .res {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 11px 5px 7px;
        background: linear-gradient(#4a3320, #2e1f13);
        border: 1px solid #c9a24a;
        border-radius: 16px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 220, 150, 0.25);
        font: 700 15px/1 Georgia, 'Times New Roman', serif;
        color: #f7e7c2;
        text-shadow: 0 1px 0 #000;
      }
      .res.full { color: #ff9b7a; }
      .res.peace { color: #bfe3a8; font-size: 13px; padding: 5px 10px; }
      .res.war { color: #fff; font-size: 13px; padding: 5px 10px; background: linear-gradient(#a8352a, #6e1d15); border-color: #ffb08a; }
      .ic { display: inline-flex; width: 18px; height: 18px; flex: none; }
      .ic svg { width: 100%; height: 100%; }

      #toast {
        position: fixed;
        top: calc(env(safe-area-inset-top, 0px) + 50px);
        left: 50%;
        transform: translateX(-50%);
        background: #7a2418;
        border: 1px solid #e0a070;
        padding: 6px 14px;
        border-radius: 14px;
        font: 600 13px/1.2 Georgia, serif;
        color: #fff1dc;
        opacity: 0;
        pointer-events: none;
        white-space: nowrap;
      }
      #toast.show { animation: toast 1.8s ease-out forwards; }
      @keyframes toast { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }

      #panel {
        position: fixed;
        left: 8px;
        right: 8px;
        bottom: calc(env(safe-area-inset-bottom, 0px) + 8px);
        max-width: 460px;
        margin: 0 auto;
        padding: 10px 12px 12px;
        box-sizing: border-box;
        background:
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.025) 0 2px, transparent 2px 9px),
          linear-gradient(#4a3320, #2b1c11);
        border: 2px solid #c9a24a;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 220, 150, 0.2);
        color: #f7e7c2;
        font-family: Georgia, 'Times New Roman', serif;
      }
      #panel .head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 16px; letter-spacing: 0.02em; color: #ffe6a8; text-shadow: 0 1px 0 #000; }
      #panel .head small { font-weight: 400; font-size: 13px; opacity: 0.85; margin-left: 6px; display: inline-flex; align-items: center; gap: 2px; }
      #panel .hint { font-size: 13px; font-style: italic; opacity: 0.8; margin: 4px 0 9px; }
      #panel .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
      #panel .row > button:not(.card):not(.go) { flex: 1 0 auto; padding: 0 9px; }
      #panel .head .tools { display: flex; gap: 6px; align-items: center; }
      #panel .head small.hp { color: #b9f0a8; }
      #panel button.toggle { display: inline-flex; align-items: center; gap: 4px; }
      #panel button.toggle .ic { width: 16px; height: 16px; }
      #panel button.toggle.on { background: linear-gradient(#c9a24a, #8a6a24); color: #2b1c11; border-color: #ffe6a8; }
      #panel .head button.toggle { min-height: 36px; font-size: 13px; }
      #panel .queue { font-size: 13px; opacity: 0.85; }
      #panel button {
        min-height: 46px;
        padding: 0 12px;
        background: linear-gradient(#6b4a2c, #4a3220);
        color: #f7e7c2;
        border: 1px solid #a88338;
        border-radius: 8px;
        box-shadow: 0 2px 0 #1a1008, inset 0 1px 0 rgba(255, 220, 150, 0.25);
        font: 700 14px/1.1 Georgia, serif;
        cursor: pointer;
        touch-action: manipulation;
      }
      #panel button:active { transform: translateY(1px); box-shadow: 0 1px 0 #1a1008; }
      #panel button:disabled { opacity: 0.45; cursor: not-allowed; }
      #panel button.card { display: flex; align-items: center; gap: 6px; flex: 1 1 0; min-width: 0; padding: 6px 8px; text-align: left; font-size: 13px; }
      #panel button.card > .ic { width: 26px; height: 26px; }
      #panel button.card span { display: flex; flex-direction: column; gap: 3px; }
      #panel button.card small { font-weight: 400; font-size: 12px; display: inline-flex; align-items: center; gap: 2px; }
      #panel button.card small .ic { width: 14px; height: 14px; }
      #panel button.poor small { color: #ffa27a; }
      #panel button.go { flex: 1; background: linear-gradient(#4f8a3a, #356226); border-color: #a8d890; }
      #panel button.x { min-height: 36px; min-width: 44px; padding: 0; font-size: 16px; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading">Loading…</div>
    <div id="top"></div>
    <div id="toast"></div>
    <div id="panel"></div>
    <div id="modal"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
